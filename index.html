<!DOCTYPE html>
<html lang="tr">
<head>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  
  <title>Lion Weather App - Anlık Hava Durumu Sorgulama</title>
 
  <meta name="description" content="Lion Weather App ile dünya genelindeki tüm şehirlerin anlık hava durumunu, sıcaklık, rüzgar hızı ve nem oranlarını hızlıca öğrenin.">
  <meta name="keywords" content="hava durumu, weather app, istanbul hava durumu, anlık hava durumu, lion weather">
  <meta name="author" content="Mehmet Hamza">
  
  
  <!-- Sosyal Medya Paylaşım Kartları (Open Graph) -->
  <meta property="og:title" content="Lion Weather App - Anlık Hava Durumu">
  <meta property="og:description" content="Şehir bazlı anlık hava durumu ve tahmin uygulaması.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://SENIN-PROJE-ADIN.vercel.app">
  

  <!-- Favicon (Tarayıcı Sekme Logosu) -->
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="stylesheet" href="WeatherFindProject.css">
</head>
</head>
<body>

  <!-- Custom Alert Notification Box -->
  <div id="custom-alert" class="alert-box">
    <span class="alert-icon">⚠️</span>
    <span class="alert-message">Lütfen geçerli bir şehir adı giriniz!</span>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-content">
      <img style="width: 100px;" src="lion-head-png-logo-4.png" alt="">
      <h1 class="logo-title">Lion Weather App</h1>
      <div class="header-icon-container">
      </div>
    </div>
  </header>

  <div class="app-container">
    
    <!-- Search Card -->
    <div class="inputCard">
      <h2>Şehir Hava Durumu Sorgula</h2>
      <form id="search-form" class="search-box" novalidate>
        <input 
          id="input" 
          type="text" 
          placeholder="Örn: İstanbul, London..." 
          required 
          autocomplete="off"
        />
        <button type="submit" class="input-btn">Ara</button>
      </form>
      <div class="errorCard">
        <h3>Aranan şehir bulunamadı ❌</h3>
      </div>
    </div>

    <!-- Conclusion Card -->
    <div class="main-content">
      
      <!-- Weather Conclusion Card -->
      <div class="result-card">
        <div class="location-info">
          <h2 class="city">Şehir Seçin</h2>
          <h3 class="country">Ülke Bilgisi</h3>
        </div>

        <div class="weather-details">
          <div class="detail-item">
            <span>Sıcaklık</span>
            <strong class="sicaklik">-</strong>
          </div>
          <div class="detail-item">
            <span>Rüzgar Hızı</span>
            <strong class="rüzgar">-</strong>
          </div>
          <div class="detail-item">
            <span>Nem Oranı</span>
            <strong class="nem">-</strong>
          </div>
        </div>
      </div>

      <!-- Last Calls -->
      <div class="lastFiveCity">
        <h3>Son Arananlar</h3>
        <ul class="ul">
          <li style="color: #64748b; font-style: italic;">Henüz arama yapılmadı</li>
        </ul>
      </div>

    </div>

  </div>

  <!-- Loading Screen -->
  <div class="loadingDiv">
    <h2 class="loadingText" style="color: white;">Veriler Alınıyor...</h2>
  </div>

  <script src="WeatherFindProject.js"></script>
    
</body>
</html>
